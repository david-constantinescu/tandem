# Production-like stack: PostgreSQL, a one-shot migration, the web app and the job worker.
# Usage: cp .env.example .env  (fill in secrets)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tandem-change-me}
      POSTGRES_DB: tandem
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandem"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  migrate:
    build: .
    image: tandem-app:latest
    env_file: .env
    environment: &dbenv
      DATABASE_URL: postgresql+psycopg://tandem:${POSTGRES_PASSWORD:-tandem-change-me}@db:5432/tandem
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      STORAGE_LOCAL_PATH: /data/storage
    volumes: [storage:/data/storage]
    command: ["flask", "db", "upgrade"]
    depends_on:
      db: { condition: service_healthy }

  web:
    image: tandem-app:latest
    env_file: .env
    environment:
      <<: *dbenv
      BROWSER_WORKER_ENABLED: "true"   # the browser-worker service below runs Playwright jobs
    volumes: [storage:/data/storage]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    image: tandem-app:latest
    env_file: .env
    environment: *dbenv
    volumes: [storage:/data/storage]
    command: ["flask", "worker", "--skip", "browser_task"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  browser-worker:
    build: { context: ., dockerfile: Dockerfile.browser }
    env_file: .env
    environment: *dbenv
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
  storage:
